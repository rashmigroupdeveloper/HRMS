# NFR-03/04, docs/14 §10, W1-T01..05: native PostgreSQL, isolated test data.
name: CI

on:
  push:
    branches: [main, 'remediation/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-synthetic-key-never-use-in-production
      DATABASE_URL: postgresql://hrms_ci:ci-only@127.0.0.1:55432/hrms_ci_test
      TEST_DATABASE_URL: postgresql://hrms_ci:ci-only@127.0.0.1:55432/hrms_ci_test
      MIGRATION_TEST_DATABASE_URL: postgresql://hrms_ci:ci-only@127.0.0.1:55432/hrms_ci_migration_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install native PostgreSQL 16 (no Docker)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-contrib-16
          sudo pg_createcluster 16 hrms-ci --port 55432 --start
          sudo -u postgres psql -p 55432 -v ON_ERROR_STOP=1 -c "CREATE ROLE hrms_ci LOGIN SUPERUSER PASSWORD 'ci-only';"
          sudo -u postgres createdb -p 55432 -O hrms_ci hrms_ci_test
          sudo -u postgres createdb -p 55432 -O hrms_ci hrms_ci_migration_test
          test "$(psql "$TEST_DATABASE_URL" -Atc 'SHOW server_version_num')" -ge 160000
          test "$(psql "$TEST_DATABASE_URL" -Atc 'SHOW server_version_num')" -lt 170000
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Rehearse all migrations on a separate empty database
        run: npm run verify:migrations
      - name: Prepare integration database
        run: |
          npm run migrate
          npm run seed:rbac
          npm run seed:settings
          npm run seed:workflows
      - name: Verify (static gates, integration tests, 80% coverage, build)
        run: npm run verify
      - name: Preserve coverage evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify (typecheck, lint, knip, tests, build)
        run: npm run verify
