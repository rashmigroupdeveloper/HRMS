# P0-T11 / NFR-06: deploy production → cPanel via SSH + scripts/deploy.sh
# Branch model: feature → main (CI) → production (this workflow).
name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          port: ${{ secrets.CPANEL_PORT }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.CPANEL_APP_DIR }}"
            test -n "$APP_DIR"
            test -d "$APP_DIR"
            export PATH="/usr/bin:$PATH"
            export HRMS_FREEZE_FILE="${HRMS_FREEZE_FILE:-/var/hrms/DEPLOY_FREEZE}"
            cd "$APP_DIR"
            bash scripts/deploy.sh
